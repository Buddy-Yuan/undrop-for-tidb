[package]
name = "todu"
version = "0.1.0"
edition = "2021"
description = "TiDB/TiKV offline data unloader - recover table data directly from RocksDB SST files (like Oracle ODU/BBED)"

[dependencies]
rocksdb = "0.21.0"
snap = "1.1.0"
lz4_flex = "0.11.1"
zstd = "0.13.1"
serde = { version = "=1.0.152", features = ["derive"] }
serde_json = "=1.0.91"
hex = "0.4.3"
chrono = "=0.4.23"

[profile.release]
opt-level = 2
